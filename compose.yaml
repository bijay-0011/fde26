services:
  # ---------------------------------------------------------
  # 1. Operational Source DB (The Black-Box E-commerce Backend)
  # ---------------------------------------------------------
  postgres_oltp:
    image: postgres:17
    container_name: olist_postgres_oltp
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oltp_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d oltp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_oltp_data:/var/lib/postgresql/data
    networks:
      - pg_network

  # ---------------------------------------------------------
  # 2. Analytics Target DB (For student use later)
  # ---------------------------------------------------------
  postgres_analytics:
    image: postgres:17
    container_name: olist_postgres_analytics
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: analytics_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    networks:
      - pg_network

  # ---------------------------------------------------------
  # 3. Database Management UI
  # ---------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - postgres_oltp
      - postgres_analytics
    networks:
      - pg_network

  # ---------------------------------------------------------
  # 4. Object Storage Data Lake
  # ---------------------------------------------------------
  minio:
    image: pgsty/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9090:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - minio_data:/data
    networks:
      - pg_network

volumes:
  postgres_oltp_data:
    driver: local
  postgres_analytics_data:
    driver: local
  minio_data:
    driver: local

networks:
  pg_network:
    driver: bridge